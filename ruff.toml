target-version = "py313"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[lint.per-file-ignores]
"setups/xubuntu/**" = ["UP", "B", "SIM"]  # legacy xubuntu configs, not worth fixing
"setups/common/.pdbrc.py" = ["T100"]  # pdb import is intentional
